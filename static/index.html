<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Phishing detector</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:0 1rem;background:#f6f8fa;color:#182230}textarea,input{width:100%;padding:.7rem;margin:.3rem 0 1rem;box-sizing:border-box}button{padding:.7rem 1.2rem;background:#1463d6;color:#fff;border:0;border-radius:5px}pre{white-space:pre-wrap;background:#fff;padding:1rem;border-radius:5px}.note{color:#555}</style></head>
<body><h1>AI phishing/scam detector</h1><p class="note">Local educational dashboard. Do not paste passwords, tokens, or confidential messages.</p>
<label>URL <input id="url" placeholder="https://example.com"></label><label>Message/email <textarea id="text" rows="6" placeholder="Paste text to assess"></textarea></label><label>HTML (optional) <textarea id="html" rows="4"></textarea></label><button onclick="detect()">Analyze</button><pre id="result">Ready.</pre>
<script>async function detect(){const r=document.getElementById('result');r.textContent='Analyzing...';try{const body={url:document.getElementById('url').value||null,text:document.getElementById('text').value||null,html:document.getElementById('html').value||null};const x=await fetch('/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});r.textContent=JSON.stringify(await x.json(),null,2)}catch(e){r.textContent='Request failed: '+e}}</script></body></html>
